[package]
name = "messenger"
version = "0.0.2"
description = "A lightweight macOS desktop app for Facebook Messenger"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
