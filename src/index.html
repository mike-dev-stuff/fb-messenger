<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Messenger</title>
    <style>
      body {
        margin: 0;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #00c6ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown while Messenger loads; main.rs navigates away once this paints. -->
    <div class="spinner"></div>
  </body>
</html>
